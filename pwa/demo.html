<!DOCTYPE html>
<html lang="id" class="bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRCM MBG — UI Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/shared/style.css">
  <style>
    body { background: #0f172a; font-family: system-ui, sans-serif; margin: 0; }
    iframe { border: none; width: 100%; height: calc(100vh - 62px); display: block; }
    .tab { cursor: pointer; padding: 6px 12px; font-size: 11px; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.15s; flex-shrink: 0; }
    .tab.active { color: #4ade80; border-color: #4ade80; }
    .tab:not(.active) { color: #64748b; }
    .tab:not(.active):hover { color: #cbd5e1; }
    .sep { color: #1e293b; padding: 0 4px; font-size: 18px; line-height: 62px; flex-shrink: 0; }
    .grp { color: #334155; font-size: 9px; text-transform: uppercase; letter-spacing: .05em; padding: 0 6px; line-height: 62px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="bg-slate-900 border-b border-slate-800 flex items-center px-3 overflow-x-auto" style="height:62px; gap:0">
    <span class="text-green-400 font-bold text-sm mr-3 flex-shrink-0">⛓️ SRCM MBG</span>

    <span class="grp">Auth</span>
    <div class="tab active" data-url="/demo/login.html">🔐 Login</div>
    <div class="tab" data-url="/demo/register.html">📝 Register</div>

    <span class="sep">|</span>
    <span class="grp">Dapur</span>
    <div class="tab" data-url="/demo/dapur-dashboard.html">📊 Dashboard</div>
    <div class="tab" data-url="/demo/menu-planner.html">🍽️ Menu Planner</div>
    <div class="tab" data-url="/demo/market-prices.html">💰 Harga Pasar</div>
    <div class="tab" data-url="/demo/po.html">📋 Purchase Order</div>
    <div class="tab" data-url="/demo/delivery.html">🚚 Pengiriman</div>
    <div class="tab" data-url="/demo/qc.html">✅ QC Barang</div>
    <div class="tab" data-url="/demo/chat.html">💬 Chat</div>

    <span class="sep">|</span>
    <span class="grp">Admin</span>
    <div class="tab" data-url="/demo/admin-dashboard.html">⚙️ Dashboard</div>
    <div class="tab" data-url="/demo/admin-suppliers.html">🏭 Supplier</div>

    <span class="sep">|</span>
    <span class="grp">Supplier (Publik)</span>
    <div class="tab" data-url="/demo/price-update.html">📲 Isi Harga</div>
    <div class="tab" data-url="/demo/po-confirm.html">✅ Konfirmasi PO</div>
  </div>

  <iframe id="preview" src="/demo/login.html"></iframe>

  <script>
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('preview').src = tab.dataset.url;
      });
    });
  </script>
</body>
</html>
