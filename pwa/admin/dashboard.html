<!DOCTYPE html>
<html lang="id" class="bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — SRCM MBG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body class="bg-slate-950 text-slate-100">
<div id="app"></div>

<script type="module">
import { requireAuth }    from '/shared/auth.js';
import { initLayout, showLoading, showToast, formatRp, formatDate, formatDateTime, statusChip } from '/shared/components.js';
import { dbGetAll, getAllSuppliers, getAllMarketPrices, orderBy, where } from '/shared/db.js';
import { getWALogs }      from '/shared/wa.js';
import { askAI, PROMPTS } from '/shared/ai.js';
import { PLATFORM_CONFIG } from '/firebase-config.js';

const user = await requireAuth('admin');
showLoading(true, 'Memuat admin dashboard...');

const [allPO, suppliers, marketPrices] = await Promise.all([
  dbGetAll('purchase_orders', [orderBy('createdAt','desc')]),
  getAllSuppliers(),
  getAllMarketPrices(),
]);

const now      = new Date();
const thisMonth = allPO.filter(p => {
  const d = new Date(p.createdAt);
  return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
});

const totalTrx     = thisMonth.reduce((s,p) => p.status !== 'rejected' ? s+(p.total||0) : s, 0);
const totalFee     = Math.round(totalTrx * PLATFORM_CONFIG.managementFee);
const pendingPO    = allPO.filter(p => p.status === 'pending_approval').length;
const waLogs       = getWALogs();

// Kompute supplier yang perlu di-update harga
const staleSuppliers = suppliers.filter(s => !s.lastPriceUpdate || (Date.now() - s.lastPriceUpdate > 7*86400000));

function renderAdminSidebar() {
  const active = window.location.pathname;
  const menu = [
    { icon:'📊', label:'Dashboard',    href:'/admin/dashboard.html' },
    { icon:'🏭', label:'Supplier',     href:'/admin/suppliers.html' },
    { icon:'💰', label:'Harga Pasar',  href:'/admin/market-prices.html' },
    { icon:'📋', label:'Semua PO',     href:'/admin/all-po.html' },
    { icon:'💸', label:'Management Fee',href:'/admin/fees.html' },
    { icon:'📲', label:'WA Log',       href:'/admin/wa-log.html' },
  ];
  return `<aside class="w-52 bg-slate-900 min-h-[calc(100vh-57px)] border-r border-slate-800 py-3 flex-shrink-0">
    ${menu.map(m => {
      const isActive = active.endsWith(m.href);
      return `<a href="${m.href}" class="flex items-center gap-2.5 px-4 py-2.5 text-sm transition-colors
        ${isActive ? 'bg-green-950 text-green-300 border-r-2 border-green-500 font-medium' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}">
        <span>${m.icon}</span><span>${m.label}</span>
      </a>`;
    }).join('')}
  </aside>`;
}

const mainHtml = `
<div class="flex">
  ${renderAdminSidebar()}
  <main class="flex-1 p-6 page-fade space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-bold text-white">⚙️ Admin Dashboard</h2>
        <p class="text-slate-400 text-sm mt-1">Platform SRCM MBG — ${now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
      </div>
      <a href="/admin/suppliers.html" class="btn-primary text-sm">🏭 Kelola Supplier</a>
    </div>

    <!-- Stats utama -->
    <div class="grid grid-cols-4 gap-4">
      <div class="bg-slate-800 border border-green-800 rounded-xl p-4 card-hover">
        <p class="text-slate-400 text-xs mb-1">Total Transaksi (Bulan Ini)</p>
        <p class="text-2xl font-bold text-green-400">${formatRp(totalTrx)}</p>
        <p class="text-slate-500 text-xs mt-1">${thisMonth.length} PO selesai</p>
      </div>
      <div class="bg-slate-800 border border-purple-800 rounded-xl p-4 card-hover">
        <p class="text-slate-400 text-xs mb-1">Management Fee (${(PLATFORM_CONFIG.managementFee*100).toFixed(0)}%)</p>
        <p class="text-2xl font-bold text-purple-400">${formatRp(totalFee)}</p>
        <p class="text-slate-500 text-xs mt-1">Revenue platform</p>
      </div>
      <div class="bg-slate-800 border border-yellow-800 rounded-xl p-4 card-hover">
        <p class="text-slate-400 text-xs mb-1">PO Pending Approval</p>
        <p class="text-2xl font-bold text-yellow-400">${pendingPO}</p>
        <p class="text-slate-500 text-xs mt-1">Menunggu review</p>
      </div>
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 card-hover">
        <p class="text-slate-400 text-xs mb-1">Supplier Terdaftar</p>
        <p class="text-2xl font-bold text-white">${suppliers.length}</p>
        <p class="text-slate-500 text-xs mt-1">${marketPrices.length} jenis bahan tercatat</p>
      </div>
    </div>

    <!-- Alert: supplier yang perlu update harga -->
    ${staleSuppliers.length > 0 ? `
    <div class="bg-yellow-950 border border-yellow-700 rounded-xl p-4 flex items-center justify-between">
      <div>
        <p class="text-yellow-300 font-semibold">⚠️ ${staleSuppliers.length} Supplier Belum Update Harga (>7 hari)</p>
        <p class="text-yellow-400 text-sm mt-0.5">${staleSuppliers.map(s=>s.name).join(', ')}</p>
      </div>
      <a href="/admin/suppliers.html" class="bg-yellow-700 text-white text-sm px-4 py-2 rounded-lg hover:bg-yellow-600">
        📲 Blast Sekarang
      </a>
    </div>` : `
    <div class="bg-green-950 border border-green-800 rounded-xl p-3">
      <p class="text-green-300 text-sm">✅ Semua supplier sudah update harga dalam 7 hari terakhir</p>
    </div>`}

    <div class="grid grid-cols-2 gap-6">
      <!-- PO terbaru -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-white font-semibold">📋 PO Terbaru</h3>
          <a href="/admin/all-po.html" class="text-green-400 text-xs hover:underline">Semua →</a>
        </div>
        ${allPO.slice(0,6).map(po => `
        <div class="flex items-center justify-between py-2.5 border-b border-slate-700 last:border-0">
          <div>
            <p class="text-white text-sm font-medium">${po.poId}</p>
            <p class="text-slate-400 text-xs">${po.dapurName} · ${formatRp(po.total)} · Fee: ${formatRp(Math.round((po.total||0)*PLATFORM_CONFIG.managementFee))}</p>
          </div>
          ${statusChip(po.status)}
        </div>`).join('')}
      </div>

      <!-- WA Activity -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-white font-semibold">📲 Aktivitas WhatsApp</h3>
          <span class="text-slate-400 text-xs">${waLogs.length} log</span>
        </div>
        ${waLogs.length ? waLogs.slice(0,8).map(l => `
        <div class="flex items-center gap-2 py-1.5 border-b border-slate-700 last:border-0 text-xs">
          <span class="text-slate-500">${new Date(l.sentAt).toLocaleString('id-ID',{hour:'2-digit',minute:'2-digit'})}</span>
          <span class="chip chip-${l.type.includes('reminder') ? 'pending' : 'approved'} text-xs">${l.type.replace('_',' ')}</span>
          <span class="text-slate-300 truncate">${l.phone}</span>
        </div>`).join('')
        : '<p class="text-slate-500 text-sm">Belum ada aktivitas WA.</p>'}
      </div>
    </div>

    <!-- Harga pasar snapshot -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-white font-semibold">📊 Harga Pasar Terkini</h3>
        <a href="/admin/suppliers.html" class="text-green-400 text-xs hover:underline">Update harga →</a>
      </div>
      <div class="grid grid-cols-4 gap-3">
        ${marketPrices.slice(0,8).map(mp => `
        <div class="bg-slate-700 rounded-xl p-3">
          <p class="text-slate-300 text-xs font-medium">${mp.namaItem}</p>
          <p class="text-green-400 font-bold text-sm">${formatRp(mp.lowestPrice)}<span class="text-slate-400 text-xs font-normal">/${mp.satuan}</span></p>
          <p class="text-slate-500 text-xs">${mp.suppliers?.length || 0} supplier</p>
        </div>`).join('')}
        ${marketPrices.length === 0 ? '<p class="text-slate-500 text-sm col-span-4">Belum ada data harga. Tambah supplier dan blast WA dulu.</p>' : ''}
      </div>
    </div>

    <!-- AI Insight Admin -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-white font-semibold">🤖 AI Platform Insight</h3>
        <button id="btn-insight" class="text-green-400 text-xs hover:underline">Refresh</button>
      </div>
      <div id="ai-insight">
        <div class="flex items-center gap-2 text-slate-400 text-sm">
          <div class="spinner" style="width:16px;height:16px;border-width:2px"></div> Menganalisis...
        </div>
      </div>
    </div>
  </main>
</div>`;

showLoading(false);

// Override initLayout biar gak dobel sidebar
document.documentElement.className = 'bg-slate-950 text-slate-100';
document.body.style.margin = '0';
document.getElementById('app').innerHTML = `
  <nav class="bg-slate-900 border-b border-slate-700 px-5 py-3 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <span class="text-green-400 font-bold">⛓️ SRCM MBG</span>
      <span class="text-slate-600">|</span>
      <span class="text-slate-400 text-sm">Admin Panel</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-slate-200 text-sm">${user.name}</span>
      <span class="chip chip-pending text-xs">⚙️ Admin</span>
      <button id="btn-logout" class="text-slate-500 hover:text-red-400 text-xs border border-slate-700 px-3 py-1 rounded">Keluar</button>
    </div>
  </nav>
  ${mainHtml}`;

document.getElementById('btn-logout')?.addEventListener('click', async () => {
  const { logout } = await import('/shared/auth.js');
  await logout();
});

// AI Insight
async function loadInsight() {
  const el = document.getElementById('ai-insight');
  el.innerHTML = '<div class="flex items-center gap-2 text-slate-400 text-sm"><div class="spinner" style="width:16px;height:16px;border-width:2px"></div> Menganalisis...</div>';
  const ctx = JSON.stringify({
    total_transaksi: totalTrx, management_fee: totalFee, total_po: thisMonth.length,
    pending_po: pendingPO, suppliers: suppliers.length, bahan_tercatat: marketPrices.length,
    stale_suppliers: staleSuppliers.map(s=>s.name),
    top_bahan_murah: marketPrices.sort((a,b)=>a.lowestPrice-b.lowestPrice).slice(0,3).map(m=>`${m.namaItem} Rp${m.lowestPrice}/${m.satuan}`)
  });
  try {
    const r = await askAI(PROMPTS.DAILY_INSIGHT, `Data platform SRCM MBG: ${ctx}`);
    el.innerHTML = `<div class="ai-box text-sm text-slate-200 leading-relaxed">${r.replace(/\n/g,'<br>')}</div>`;
  } catch { el.innerHTML = '<p class="text-slate-500 text-xs">AI insight tidak tersedia.</p>'; }
}
loadInsight();
document.getElementById('btn-insight')?.addEventListener('click', loadInsight);
</script>
</body>
</html>
