<!DOCTYPE html>
<html lang="id" class="bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox PO — SRCM MBG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body class="bg-slate-950 text-slate-100">
<div id="app"></div>

<script type="module">
  import { requireAuth } from '/shared/auth.js';
  import { initLayout, showLoading, showToast, formatRp, formatDate, statusChip, openModal, closeModal } from '/shared/components.js';
  import { dbGetAll, dbUpdate, createDelivery, orderBy, where } from '/shared/db.js';
  import { askAI, PROMPTS } from '/shared/ai.js';

  const user = await requireAuth('supplier');
  showLoading(true, 'Memuat PO inbox...');

  let allPO = await dbGetAll('purchase_orders', [orderBy('createdAt','desc')]);
  let activeFilter = 'semua';

  function filtered() {
    return activeFilter === 'semua' ? allPO
      : allPO.filter(p => p.status === activeFilter);
  }

  function renderPoTable(list) {
    if (!list.length) return '<p class="text-slate-500 text-sm text-center py-8">Tidak ada PO.</p>';
    return `<div class="divide-y divide-slate-700">` + list.map(po => `
    <div class="p-4 hover:bg-slate-750 cursor-pointer po-row" data-id="${po.poId}">
      <div class="flex items-start justify-between gap-4">
        <div class="flex-1">
          <div class="flex items-center gap-2 mb-1">
            <p class="text-white font-semibold">${po.poId}</p>
            ${statusChip(po.status)}
          </div>
          <p class="text-slate-300 text-sm">🍽️ ${po.dapurName || 'Dapur'}</p>
          <p class="text-slate-400 text-xs mt-0.5">
            ${formatDate(po.createdAt)} · ${po.items?.length || 0} item · Kirim: ${po.deliveryDate || '-'}
          </p>
          ${po.notes ? `<p class="text-slate-500 text-xs mt-0.5">📝 ${po.notes}</p>` : ''}
        </div>
        <div class="text-right flex-shrink-0">
          <p class="text-green-400 font-bold text-lg">${formatRp(po.total)}</p>
          ${po.status === 'pending_approval' ? `
          <div class="flex gap-2 mt-2">
            <button class="btn-approve bg-green-700 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-green-600"
              data-id="${po.poId}">✅ Approve</button>
            <button class="btn-reject bg-red-900 text-red-300 text-xs px-3 py-1.5 rounded-lg hover:bg-red-800"
              data-id="${po.poId}">❌ Tolak</button>
          </div>` : ''}
          ${po.status === 'approved' && !po.deliveryCreated ? `
          <button class="btn-create-dlv bg-blue-900 text-blue-300 text-xs px-3 py-1.5 rounded-lg hover:bg-blue-800 mt-2"
            data-id="${po.poId}" data-dapur="${po.dapurId}" data-date="${po.deliveryDate}">
            🚛 Buat Pengiriman
          </button>` : ''}
        </div>
      </div>
    </div>`).join('') + '</div>';
  }

  const mainHtml = `
  <div class="space-y-5 max-w-5xl">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-bold text-white">📬 Inbox Purchase Order</h2>
        <p class="text-slate-400 text-sm mt-1">Review dan approve PO dari dapur</p>
      </div>
      <div class="flex gap-2">
        ${['semua','pending_approval','approved','rejected','delivered'].map(s => `
        <button data-filter="${s}" class="filter-btn text-xs px-3 py-1 rounded-full border
          ${s==='semua' ? 'border-green-500 text-green-300 bg-green-950' : 'border-slate-700 text-slate-400'}">
          ${s === 'semua' ? 'Semua' : s === 'pending_approval' ? 'Pending' : s.charAt(0).toUpperCase()+s.slice(1)}
          ${s === 'pending_approval' && allPO.filter(p=>p.status===s).length > 0 ?
            `<span class="ml-1 bg-red-500 text-white text-xs px-1 rounded-full">${allPO.filter(p=>p.status===s).length}</span>` : ''}
        </button>`).join('')}
      </div>
    </div>

    <div id="po-table" class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden">
      ${renderPoTable(filtered())}
    </div>
  </div>`;

  showLoading(false);
  initLayout('Inbox PO', user, mainHtml);

  function refreshTable() {
    document.getElementById('po-table').innerHTML = renderPoTable(filtered());
    bindActions();
  }

  function bindActions() {
    // PO detail modal (klik row)
    document.querySelectorAll('.po-row').forEach(row => {
      row.addEventListener('click', e => {
        if (e.target.closest('button')) return; // jangan trigger kalau klik tombol
        const po = allPO.find(p => p.poId === row.dataset.id);
        if (!po) return;
        showPODetail(po);
      });
    });

    // Approve
    document.querySelectorAll('.btn-approve').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        const poId = btn.dataset.id;
        const po = allPO.find(p => p.poId === poId);
        if (!confirm(`Approve PO ${poId} sebesar ${formatRp(po?.total || 0)}?`)) return;

        btn.disabled = true; btn.textContent = 'Memproses...';
        try {
          await dbUpdate('purchase_orders', poId, {
            status: 'approved',
            approvedAt: Date.now(),
            approvedBy: user.uid
          });
          allPO = allPO.map(p => p.poId === poId ? {...p, status:'approved', approvedAt:Date.now()} : p);
          showToast(`PO ${poId} disetujui!`, 'success');
          refreshTable();

          // Auto-generate dokumen
          generateDocuments(po);
        } catch (e) {
          showToast('Gagal approve: ' + e.message, 'error');
          btn.disabled = false; btn.textContent = '✅ Approve';
        }
      });
    });

    // Reject
    document.querySelectorAll('.btn-reject').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        const poId = btn.dataset.id;
        const alasan = prompt(`Alasan penolakan PO ${poId}:`);
        if (!alasan) return;

        btn.disabled = true;
        try {
          await dbUpdate('purchase_orders', poId, { status:'rejected', rejectReason: alasan });
          allPO = allPO.map(p => p.poId === poId ? {...p, status:'rejected'} : p);
          showToast(`PO ${poId} ditolak`, 'warning');
          refreshTable();
        } catch (e) {
          showToast('Gagal reject: ' + e.message, 'error');
        }
      });
    });

    // Buat Pengiriman
    document.querySelectorAll('.btn-create-dlv').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        const poId     = btn.dataset.id;
        const dapurId  = btn.dataset.dapur;
        const delDate  = btn.dataset.date;
        showCreateDeliveryModal(poId, dapurId, delDate);
      });
    });
  }

  function showPODetail(po) {
    openModal('po-modal', `
    <div class="p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-white font-bold">${po.poId}</h3>
        ${statusChip(po.status)}
      </div>
      <div class="grid grid-cols-2 gap-3 text-sm">
        <div><span class="text-slate-400">Dapur:</span> <span class="text-white">${po.dapurName}</span></div>
        <div><span class="text-slate-400">Dibuat:</span> <span class="text-white">${formatDate(po.createdAt)}</span></div>
        <div><span class="text-slate-400">Tgl Kirim:</span> <span class="text-white">${po.deliveryDate || '-'}</span></div>
        <div><span class="text-slate-400">Catatan:</span> <span class="text-white">${po.notes || '-'}</span></div>
      </div>
      <div class="overflow-x-auto">
        <table class="tbl">
          <thead><tr><th>Bahan</th><th>Qty</th><th>Satuan</th><th>Harga</th><th>Subtotal</th></tr></thead>
          <tbody>
            ${(po.items||[]).map(i => `<tr>
              <td>${i.nama}</td><td>${i.qty}</td><td>${i.satuan}</td>
              <td>${formatRp(i.harga_satuan)}</td><td class="text-green-300">${formatRp(i.subtotal)}</td>
            </tr>`).join('')}
          </tbody>
          <tfoot><tr>
            <td colspan="4" class="text-right font-semibold text-white py-2 px-3">Total</td>
            <td class="font-bold text-green-400 py-2 px-3">${formatRp(po.total)}</td>
          </tr></tfoot>
        </table>
      </div>
      <div id="doc-result" class="hidden"></div>
      <div class="flex gap-3 flex-wrap">
        <button id="btn-gen-invoice" class="btn-sec text-xs">📄 Generate Invoice</button>
        <button id="btn-gen-sj" class="btn-sec text-xs">📦 Generate Surat Jalan</button>
        <button onclick="closeModal('po-modal')" class="btn-sec ml-auto text-xs">Tutup</button>
      </div>
    </div>`);

    // Generate dokumen dari dalam modal
    document.getElementById('btn-gen-invoice')?.addEventListener('click', () => generateDoc(po, 'invoice'));
    document.getElementById('btn-gen-sj')?.addEventListener('click', () => generateDoc(po, 'surat_jalan'));
  }

  async function generateDoc(po, type) {
    const el = document.getElementById('doc-result');
    if (!el) return;
    el.innerHTML = '<div class="flex items-center gap-2 text-slate-400 text-sm"><div class="spinner" style="width:16px;height:16px;border-width:2px"></div> AI generating...</div>';
    el.classList.remove('hidden');

    const prompt  = type === 'invoice' ? PROMPTS.ERP_INVOICE : PROMPTS.ERP_SURAT_JALAN;
    const context = JSON.stringify({ ...po, supplier: user.name, tanggalDokumen: new Date().toLocaleDateString('id-ID') });

    try {
      const doc = await askAI(prompt, context);
      el.innerHTML = `
        <div class="bg-slate-900 border border-slate-600 rounded-lg p-4 font-mono text-xs text-slate-200 whitespace-pre-wrap max-h-64 overflow-y-auto">${doc}</div>
        <button onclick="window.print()" class="btn-primary text-xs mt-2">🖨️ Print / Save PDF</button>`;
    } catch (e) {
      el.innerHTML = `<p class="text-red-400 text-xs">Gagal generate: ${e.message}</p>`;
    }
  }

  function showCreateDeliveryModal(poId, dapurId, defaultDate) {
    openModal('dlv-modal', `
    <div class="p-5 space-y-4">
      <h3 class="text-white font-bold">🚛 Buat Pengiriman — ${poId}</h3>
      <div class="space-y-3">
        <div>
          <label class="text-slate-400 text-xs mb-1 block">Nama Driver</label>
          <input id="dlv-driver" type="text" class="inp" placeholder="Nama lengkap driver">
        </div>
        <div>
          <label class="text-slate-400 text-xs mb-1 block">No. HP Driver</label>
          <input id="dlv-phone" type="text" class="inp" placeholder="08xxxxxxxxxx">
        </div>
        <div>
          <label class="text-slate-400 text-xs mb-1 block">Plat Nomor</label>
          <input id="dlv-plat" type="text" class="inp" placeholder="B 1234 AB">
        </div>
        <div>
          <label class="text-slate-400 text-xs mb-1 block">Estimasi Tiba</label>
          <input id="dlv-eta" type="datetime-local" class="inp"
            value="${defaultDate}T08:00">
        </div>
      </div>
      <div class="flex gap-3">
        <button id="btn-save-dlv" class="btn-primary flex-1">Buat Pengiriman</button>
        <button onclick="closeModal('dlv-modal')" class="btn-sec">Batal</button>
      </div>
    </div>`);

    document.getElementById('btn-save-dlv')?.addEventListener('click', async () => {
      const driver = document.getElementById('dlv-driver').value.trim();
      const phone  = document.getElementById('dlv-phone').value.trim();
      const plat   = document.getElementById('dlv-plat').value.trim();
      const eta    = document.getElementById('dlv-eta').value;

      if (!driver) { showToast('Isi nama driver', 'error'); return; }

      try {
        const dlv = await createDelivery(poId, dapurId, user.uid, eta);
        await dbUpdate('deliveries', dlv.deliveryId, { driverName:driver, driverPhone:phone, platNomor:plat, status:'preparing' });
        await dbUpdate('purchase_orders', poId, { deliveryCreated: true, deliveryId: dlv.deliveryId });
        allPO = allPO.map(p => p.poId === poId ? {...p, deliveryCreated:true} : p);
        showToast('Pengiriman dibuat! ID: ' + dlv.deliveryId, 'success');
        closeModal('dlv-modal');
        refreshTable();
      } catch (e) {
        showToast('Gagal: ' + e.message, 'error');
      }
    });
  }

  async function generateDocuments(po) {
    // Auto-generate setelah approve (silent)
    try {
      const invoice = await askAI(PROMPTS.ERP_INVOICE, JSON.stringify({
        ...po, supplier: user.name, tanggalDokumen: new Date().toLocaleDateString('id-ID')
      }));
      await dbUpdate('purchase_orders', po.poId, { generatedInvoice: invoice });
    } catch {}
  }

  // Filter tabs
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.className = 'filter-btn text-xs px-3 py-1 rounded-full border border-slate-700 text-slate-400';
      });
      btn.className = 'filter-btn text-xs px-3 py-1 rounded-full border border-green-500 text-green-300 bg-green-950';
      refreshTable();
    });
  });

  bindActions();
</script>
</body>
</html>
