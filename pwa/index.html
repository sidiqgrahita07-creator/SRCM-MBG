<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRCM MBG</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body { margin: 0; background: #0f172a; display: flex; align-items: center;
           justify-content: center; height: 100vh; font-family: system-ui, sans-serif; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #16a34a;
           animation: bounce 1.2s infinite; margin: 0 4px; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }
  </style>
</head>
<body>
  <div style="display:flex;align-items:center;gap:4px">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import { firebaseConfig } from './firebase-config.js';

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    onAuthStateChanged(auth, async user => {
      if (!user) { window.location.href = '/auth/login.html'; return; }
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (!snap.exists()) { window.location.href = '/auth/login.html'; return; }
      const role = snap.data().role;
      const roleHome = { dapur: '/dapur/dashboard.html', admin: '/admin/dashboard.html' };
      window.location.href = roleHome[role] || '/auth/login.html';
    });

    // PWA service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
