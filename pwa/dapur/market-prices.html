<!DOCTYPE html>
<html lang="id" class="bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harga Pasar — SRCM MBG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body class="bg-slate-950 text-slate-100">
<div id="app"></div>

<script type="module">
import { requireAuth }    from '/shared/auth.js';
import { initLayout, showLoading, showToast, formatRp, formatDateTime, openModal, closeModal } from '/shared/components.js';
import { getAllMarketPrices, getAllSuppliers } from '/shared/db.js';
import { buildWAChatLink, buildNegotiationMessage } from '/shared/wa.js';

const user = await requireAuth('dapur');
showLoading(true, 'Memuat harga pasar...');

const [marketPrices, suppliers] = await Promise.all([getAllMarketPrices(), getAllSuppliers()]);

// Buat map supplier untuk lookup cepat
const supplierMap = {};
suppliers.forEach(s => { supplierMap[s.id] = s; });

function renderPriceCard(mp) {
  const sups    = mp.suppliers || [];
  const cheapest = sups[0];
  const savings  = mp.avgPrice - mp.lowestPrice;

  return `
  <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden card-hover">
    <!-- Header -->
    <div class="p-4 border-b border-slate-700 flex items-center justify-between">
      <div>
        <p class="text-white font-semibold">${mp.namaItem}</p>
        <p class="text-slate-400 text-xs">per ${mp.satuan} · ${sups.length} supplier</p>
      </div>
      <div class="text-right">
        <p class="text-green-400 font-bold text-lg">${formatRp(mp.lowestPrice)}</p>
        <p class="text-slate-400 text-xs">termurah</p>
      </div>
    </div>

    <!-- Price range bar -->
    <div class="px-4 py-3">
      <div class="flex justify-between text-xs text-slate-400 mb-1.5">
        <span>Termurah: <b class="text-green-400">${formatRp(mp.lowestPrice)}</b></span>
        <span>Rata-rata: <b class="text-slate-200">${formatRp(mp.avgPrice)}</b></span>
        <span>Termahal: <b class="text-red-400">${formatRp(mp.highestPrice)}</b></span>
      </div>
      <div class="h-2 bg-slate-700 rounded-full overflow-hidden">
        <div class="h-full bg-gradient-to-r from-green-500 to-red-500 rounded-full opacity-60"
          style="width: 100%"></div>
        <div class="h-full bg-green-500 rounded-full -mt-2"
          style="width: ${Math.round((mp.lowestPrice / mp.highestPrice) * 100)}%"></div>
      </div>
      ${savings > 0 ? `<p class="text-green-400 text-xs mt-1">💡 Hemat ${formatRp(savings)}/${mp.satuan} vs harga rata-rata</p>` : ''}
    </div>

    <!-- Supplier list -->
    <div class="px-4 pb-4 space-y-2">
      ${sups.map((s, i) => {
        const sup    = supplierMap[s.supplierId];
        const isBest = i === 0;
        const chatLink = buildWAChatLink(s.supplierPhone || sup?.phone || '', '');
        return `
        <div class="flex items-center justify-between py-2 border-b border-slate-700 last:border-0">
          <div class="flex items-center gap-2">
            ${isBest ? '<span class="text-xs bg-green-900 text-green-300 px-2 py-0.5 rounded-full font-bold">🏆 Terbaik</span>' : `<span class="text-slate-500 text-xs">#${i+1}</span>`}
            <div>
              <p class="text-slate-200 text-sm font-medium">${s.supplierName}</p>
              ${s.catatan ? `<p class="text-slate-500 text-xs">${s.catatan}</p>` : ''}
              <p class="text-slate-600 text-xs">Update: ${s.updatedAt ? formatDateTime(s.updatedAt) : '-'}</p>
            </div>
          </div>
          <div class="text-right flex items-center gap-2">
            <div>
              <p class="text-white font-bold">${formatRp(s.harga)}</p>
              <p class="text-slate-400 text-xs">/${mp.satuan}</p>
            </div>
            ${(s.supplierPhone || sup?.phone) ? `
            <a href="${buildWAChatLink(s.supplierPhone || sup.phone,
                buildNegotiationMessage(user.name, s.supplierName, [{namaItem: mp.namaItem, qty:'?', satuan: mp.satuan, harga: s.harga}])
              )}" target="_blank"
              class="flex items-center gap-1 text-xs bg-green-950 border border-green-800 text-green-300 px-2 py-1.5 rounded-lg hover:bg-green-900 transition-colors">
              💬 Chat WA
            </a>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- Last update -->
    <div class="px-4 pb-3">
      <p class="text-slate-600 text-xs">Data diperbarui: ${mp.lastAggregatedAt ? formatDateTime(mp.lastAggregatedAt) : 'Belum pernah'}</p>
    </div>
  </div>`;
}

function renderEmpty() {
  return `
  <div class="col-span-2 bg-slate-800 border border-slate-700 rounded-2xl p-12 text-center">
    <p class="text-4xl mb-4">📊</p>
    <p class="text-white font-semibold text-lg">Belum ada data harga pasar</p>
    <p class="text-slate-400 text-sm mt-2">Admin perlu menambahkan supplier dan meminta update harga via WhatsApp.</p>
    <a href="/dapur/chat.html" class="btn-primary mt-4 inline-block">💬 Hubungi Admin</a>
  </div>`;
}

let search = '';
let sortBy = 'nama';

function filtered() {
  return marketPrices
    .filter(p => p.namaItem.toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => {
      if (sortBy === 'nama')    return a.namaItem.localeCompare(b.namaItem);
      if (sortBy === 'harga')   return a.lowestPrice - b.lowestPrice;
      if (sortBy === 'update')  return (b.lastAggregatedAt||0) - (a.lastAggregatedAt||0);
      return 0;
    });
}

const mainHtml = `
<div class="space-y-5 max-w-6xl">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-white">📊 Harga Pasar Terkini</h2>
      <p class="text-slate-400 text-sm mt-1">Perbandingan harga dari semua supplier · Update otomatis via WhatsApp</p>
    </div>
    <a href="/dapur/menu-planner.html" class="btn-primary text-sm">🍽️ Rencanakan Menu</a>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-3 gap-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 text-center">
      <p class="text-slate-400 text-xs mb-1">Total Bahan Terdaftar</p>
      <p class="text-2xl font-bold text-white">${marketPrices.length}</p>
    </div>
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 text-center">
      <p class="text-slate-400 text-xs mb-1">Jumlah Supplier</p>
      <p class="text-2xl font-bold text-green-400">${suppliers.length}</p>
    </div>
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 text-center">
      <p class="text-slate-400 text-xs mb-1">Update Terakhir</p>
      <p class="text-lg font-bold text-blue-400">
        ${marketPrices.length > 0 && marketPrices[0].lastAggregatedAt
          ? new Date(marketPrices[0].lastAggregatedAt).toLocaleDateString('id-ID',{day:'2-digit',month:'short'})
          : '-'}
      </p>
    </div>
  </div>

  <!-- Search & sort -->
  <div class="flex gap-3">
    <input id="inp-search" type="text" class="inp flex-1" placeholder="🔍 Cari bahan...">
    <select id="inp-sort" class="inp w-44">
      <option value="nama">Urutkan: A-Z</option>
      <option value="harga">Urutkan: Termurah</option>
      <option value="update">Urutkan: Terbaru</option>
    </select>
  </div>

  <!-- Price cards grid -->
  <div id="price-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    ${marketPrices.length ? filtered().map(renderPriceCard).join('') : renderEmpty()}
  </div>
</div>`;

showLoading(false);
initLayout('Harga Pasar', user, mainHtml);

// Search & sort
document.getElementById('inp-search')?.addEventListener('input', e => {
  search = e.target.value;
  document.getElementById('price-grid').innerHTML = filtered().length
    ? filtered().map(renderPriceCard).join('') : renderEmpty();
});
document.getElementById('inp-sort')?.addEventListener('change', e => {
  sortBy = e.target.value;
  document.getElementById('price-grid').innerHTML = filtered().length
    ? filtered().map(renderPriceCard).join('') : renderEmpty();
});
</script>
</body>
</html>
