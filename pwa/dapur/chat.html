<!DOCTYPE html>
<html lang="id" class="bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Supplier — SRCM MBG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body class="bg-slate-950 text-slate-100">
<div id="app"></div>

<script type="module">
  import { requireAuth } from '/shared/auth.js';
  import { initLayout, showLoading, showToast, formatDateTime } from '/shared/components.js';
  import { askAIStream, PROMPTS } from '/shared/ai.js';
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getDatabase, ref, push, onChildAdded, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
  import { firebaseConfig } from '/firebase-config.js';

  const user = await requireAuth('dapur');
  showLoading(false);

  const app = initializeApp(firebaseConfig);
  const rtdb = getDatabase(app);

  // Chat room ID: selalu dapur vs supplier (satu channel per dapur)
  const chatId = `dapur_${user.uid}`;
  const chatRef = ref(rtdb, `chats/${chatId}/messages`);

  const mainHtml = `
  <div class="flex flex-col" style="height: calc(100vh - 57px - 48px);">
    <div class="mb-3">
      <h2 class="text-xl font-bold text-white">💬 Chat dengan Supplier</h2>
      <p class="text-slate-400 text-xs">Pesan realtime · Ketik <span class="text-green-400">@ai</span> untuk tanya AI</p>
    </div>

    <!-- Messages -->
    <div id="chat-messages" class="flex-1 overflow-y-auto space-y-3 pb-4 pr-1"></div>

    <!-- Input -->
    <div class="flex gap-2 pt-3 border-t border-slate-700 sticky bottom-0 bg-slate-950">
      <input id="chat-input" type="text" class="inp flex-1"
        placeholder="Ketik pesan... (@ai untuk tanya AI)"
        autocomplete="off">
      <button id="btn-send" class="btn-primary px-5">Kirim</button>
    </div>
  </div>`;

  initLayout('Chat Supplier', user, mainHtml);

  // ─── Render message bubble ───
  function renderBubble(msg) {
    const isMe = msg.senderRole === 'dapur';
    const isAI = msg.senderRole === 'ai';
    const wrap = document.createElement('div');
    wrap.className = `flex ${isMe ? 'justify-end' : isAI ? 'justify-start' : 'justify-start'} gap-2`;
    wrap.innerHTML = `
      <div class="max-w-[75%]">
        ${!isMe ? `<p class="text-xs text-slate-400 mb-1">${msg.senderName}</p>` : ''}
        <div class="${isAI ? 'bubble-ai' : isMe ? 'bubble-me' : 'bubble-them'}">
          <p class="text-sm leading-relaxed whitespace-pre-wrap">${msg.text}</p>
        </div>
        <p class="text-xs text-slate-600 mt-0.5 ${isMe ? 'text-right' : 'text-left'}">
          ${msg.time ? new Date(msg.time).toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'}) : ''}
        </p>
      </div>`;
    return wrap;
  }

  const msgContainer = document.getElementById('chat-messages');

  // ─── Listen realtime messages ───
  onChildAdded(chatRef, snap => {
    const msg = snap.val();
    msgContainer.appendChild(renderBubble(msg));
    msgContainer.scrollTop = msgContainer.scrollHeight;
  });

  // ─── Send message ───
  async function sendMessage(text, role = 'dapur', name = user.name) {
    await push(chatRef, {
      text, senderRole: role, senderName: name,
      senderId: role === 'dapur' ? user.uid : role,
      time: Date.now()
    });
  }

  const input = document.getElementById('chat-input');
  const btn   = document.getElementById('btn-send');

  async function handleSend() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    btn.disabled = true;

    await sendMessage(text);

    // Kalau mention @ai
    if (text.toLowerCase().includes('@ai')) {
      const aiMsg = document.createElement('div');
      aiMsg.className = 'flex justify-start gap-2';
      const bubble = document.createElement('div');
      bubble.className = 'max-w-[75%]';
      bubble.innerHTML = `<p class="text-xs text-slate-400 mb-1">🤖 AI Assistant</p>
        <div class="bubble-ai"><p id="ai-streaming" class="text-sm leading-relaxed"></p></div>`;
      aiMsg.appendChild(bubble);
      msgContainer.appendChild(aiMsg);
      msgContainer.scrollTop = msgContainer.scrollHeight;

      const el = document.getElementById('ai-streaming');
      let full = '';
      try {
        await askAIStream(PROMPTS.CHAT_ASSISTANT, text, chunk => {
          full += chunk;
          el.textContent = full;
          msgContainer.scrollTop = msgContainer.scrollHeight;
        });
        // Simpan respons AI ke Firebase
        await sendMessage(full, 'ai', '🤖 AI Assistant');
        aiMsg.remove(); // bubble streaming dihapus, yang dari Firebase yang tampil
      } catch {
        el.textContent = 'AI tidak tersedia saat ini.';
      }
    }

    btn.disabled = false;
    input.focus();
  }

  btn.addEventListener('click', handleSend);
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });
</script>
</body>
</html>
