<!DOCTYPE html>
<html lang="id" class="bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Dapur — SRCM MBG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body class="bg-slate-950 text-slate-100">
<div id="app"></div>

<script type="module">
  import { requireAuth } from '/shared/auth.js';
  import { initLayout, showLoading, formatRp, formatDate, statusChip } from '/shared/components.js';
  import { dbGetAll, dbListen, where, orderBy } from '/shared/db.js';
  import { askAI, PROMPTS } from '/shared/ai.js';

  const user = await requireAuth('dapur');
  showLoading(true, 'Memuat dashboard...');

  // Ambil data ringkasan
  const [allPO, allDelivery] = await Promise.all([
    dbGetAll('purchase_orders', [where('dapurId','==', user.uid), orderBy('createdAt','desc')]),
    dbGetAll('deliveries', [where('dapurId','==', user.uid)])
  ]);

  const pending   = allPO.filter(p => p.status === 'pending_approval').length;
  const approved  = allPO.filter(p => p.status === 'approved').length;
  const thisMonth = allPO.filter(p => {
    const d = new Date(p.createdAt);
    const n = new Date();
    return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
  });
  const totalSpend = thisMonth.reduce((s,p) => s + (p.total||0), 0);
  const activeDelivery = allDelivery.find(d => d.status === 'in_transit');

  // Recent 5 PO
  const recentPO = allPO.slice(0, 5);

  const mainHtml = `
  <div class="space-y-6">
    <!-- Header greeting -->
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-bold text-white">Selamat datang, ${user.name} 👋</h2>
        <p class="text-slate-400 text-sm mt-1">${new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'})}</p>
      </div>
      <div class="flex gap-3">
        <a href="/dapur/menu-planner.html" class="btn-primary text-sm px-4 py-2">+ Menu Plan</a>
        <a href="/dapur/po.html" class="btn-sec text-sm px-4 py-2">+ Buat PO</a>
      </div>
    </div>

    <!-- Stats cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 card-hover">
        <p class="text-slate-400 text-xs mb-1">PO Bulan Ini</p>
        <p class="text-2xl font-bold text-white">${thisMonth.length}</p>
        <p class="text-slate-500 text-xs mt-1">${formatRp(totalSpend)}</p>
      </div>
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 card-hover">
        <p class="text-slate-400 text-xs mb-1">Menunggu Approval</p>
        <p class="text-2xl font-bold text-yellow-400">${pending}</p>
        <p class="text-slate-500 text-xs mt-1">Purchase Order</p>
      </div>
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 card-hover">
        <p class="text-slate-400 text-xs mb-1">Disetujui</p>
        <p class="text-2xl font-bold text-green-400">${approved}</p>
        <p class="text-slate-500 text-xs mt-1">Siap dikirim</p>
      </div>
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 card-hover">
        <p class="text-slate-400 text-xs mb-1">Pengiriman Aktif</p>
        <p class="text-2xl font-bold text-blue-400">${activeDelivery ? '1' : '0'}</p>
        <p class="text-slate-500 text-xs mt-1">${activeDelivery ? 'Dalam perjalanan' : 'Tidak ada'}</p>
      </div>
    </div>

    <!-- Active delivery -->
    ${activeDelivery ? `
    <div class="bg-slate-800 border border-blue-800 rounded-xl p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-white font-semibold">🚚 Pengiriman Aktif</h3>
        <a href="/dapur/delivery.html" class="text-blue-400 text-xs hover:underline">Lihat detail →</a>
      </div>
      <div class="flex items-center gap-4">
        <div class="text-2xl">🚛</div>
        <div>
          <p class="text-white text-sm font-medium">PO: ${activeDelivery.poId}</p>
          <p class="text-slate-400 text-xs">Driver: ${activeDelivery.driverName || '-'} · Plat: ${activeDelivery.platNomor || '-'}</p>
          <p class="text-blue-300 text-xs mt-1">Estimasi tiba: ${activeDelivery.estimasiTiba || '-'}</p>
        </div>
      </div>
    </div>` : ''}

    <div class="grid lg:grid-cols-2 gap-6">
      <!-- Recent PO -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-white font-semibold">📋 PO Terbaru</h3>
          <a href="/dapur/po.html" class="text-green-400 text-xs hover:underline">Semua PO →</a>
        </div>
        ${recentPO.length === 0 ? '<p class="text-slate-500 text-sm">Belum ada PO.</p>' :
          recentPO.map(po => `
          <div class="flex items-center justify-between py-2.5 border-b border-slate-700 last:border-0">
            <div>
              <p class="text-white text-sm font-medium">${po.poId}</p>
              <p class="text-slate-400 text-xs">${formatDate(po.createdAt)} · ${formatRp(po.total)}</p>
            </div>
            ${statusChip(po.status)}
          </div>`).join('')}
      </div>

      <!-- AI Insight -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-white font-semibold">🤖 AI Insight Hari Ini</h3>
          <button id="btn-refresh-insight" class="text-green-400 text-xs hover:underline">Refresh</button>
        </div>
        <div id="ai-insight" class="text-slate-400 text-sm">
          <div class="flex items-center gap-2"><div class="spinner" style="width:20px;height:20px;border-width:2px"></div> Menganalisis data...</div>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      ${[
        {href:'/dapur/menu-planner.html', icon:'🍽️', label:'Rencanakan Menu'},
        {href:'/dapur/po.html',           icon:'📋', label:'Buat PO'},
        {href:'/dapur/delivery.html',     icon:'🚚', label:'Cek Pengiriman'},
        {href:'/dapur/chat.html',         icon:'💬', label:'Chat Supplier'},
      ].map(a => `
        <a href="${a.href}" class="bg-slate-800 border border-slate-700 hover:border-green-700
          rounded-xl p-4 text-center card-hover transition-colors group">
          <div class="text-2xl mb-2">${a.icon}</div>
          <p class="text-slate-300 text-sm group-hover:text-white">${a.label}</p>
        </a>`).join('')}
    </div>
  </div>`;

  showLoading(false);
  initLayout('Dashboard', user, mainHtml);

  // Load AI insight
  async function loadInsight() {
    const el = document.getElementById('ai-insight');
    if (!el) return;
    el.innerHTML = '<div class="flex items-center gap-2"><div class="spinner" style="width:20px;height:20px;border-width:2px"></div> Menganalisis...</div>';

    const context = JSON.stringify({
      total_po_bulan_ini: thisMonth.length,
      total_spend_bulan_ini: totalSpend,
      pending_approval: pending,
      riwayat_po: recentPO.map(p => ({ id: p.poId, total: p.total, status: p.status }))
    });

    try {
      const result = await askAI(PROMPTS.DAILY_INSIGHT, `Data dapur ${user.name}: ${context}`);
      el.innerHTML = `<div class="ai-box text-sm text-slate-200 leading-relaxed">${result.replace(/\n/g,'<br>')}</div>`;
    } catch {
      el.innerHTML = '<p class="text-slate-500 text-xs">AI insight tidak tersedia. Cek koneksi atau API key.</p>';
    }
  }

  loadInsight();
  document.getElementById('btn-refresh-insight')?.addEventListener('click', loadInsight);
</script>
</body>
</html>
